<!-- layout/shell/shell.component.html -->
<div class="app-shell">
  <!-- Sidebar -->
  <app-sidebar [collapsed]="sidebarCollapsed()" />

  <!-- Contenido Principal -->
  <main class="main-content" [class.sidebar-collapsed]="sidebarCollapsed()">
    <!-- Topbar -->
    <header class="topbar">
      <button class="btn-icon toggle-sidebar" (click)="toggleSidebar()" id="btn-toggle-sidebar" aria-label="Mostrar u ocultar menú" [attr.aria-expanded]="!sidebarCollapsed()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
      </button>
      <span class="topbar-label">CENTRO DE MONITOREO <b>24/7</b></span>
      <div class="topbar-right">
        <div class="user-info">
          <div class="user-avatar">
            {{ userInitials() }}
          </div>
          <div class="user-details">
            <span class="user-name">{{ authService.currentUser()?.full_name }}</span>
            <span class="user-role">{{ authService.roleNames() }}</span>
          </div>
        </div>
        <button class="btn-secondary btn-sm" (click)="logout()" id="btn-logout" title="Cerrar sesión">
          Salir
        </button>
      </div>
    </header>

    <!-- Vista hija -->
    <div class="page-wrapper">
      <router-outlet />
    </div>
  </main>
</div>
